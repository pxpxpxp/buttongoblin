name: Build and release Button Goblin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-release.yml'
      - 'mini/**'
      - 'docs/assets/**'
      - 'docs/index.html'
      - 'docs/editor/**'
      - 'mk2/**'
      - 'build-inputs/**'
      - 'tools/apply_shortcut_layout.py'
      - 'tools/animate_shortcuts.py'
      - 'tools/puft.b64'
      - 'tools/publish_release.sh'
      - 'tools/test_release_publish.py'
permissions:
  contents: write
concurrency:
  group: buttongoblin-mini-v1-release
  cancel-in-progress: false
jobs:
  mini:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Define versioned package names
        run: python3 mini/releases.py --github-env "$GITHUB_ENV"
      - name: Restore verified Button Goblin artwork and scripts
        run: |
          set -euo pipefail
          test "$(find build-inputs -name '*.b64' | wc -l)" -eq 24
          cat build-inputs/*.b64 | base64 --decode > /tmp/mini-inputs.tar.gz
          echo '6dcec86f0e3dd01e932c7b766c1791c344dfb0a78fe210f199626327b74ea807  /tmp/mini-inputs.tar.gz' | sha256sum --check
          mkdir -p /tmp/mini-base
          tar -xzf /tmp/mini-inputs.tar.gz -C /tmp/mini-base
          cp -a docs /tmp/mini-docs
      - name: Install pinned image preparation dependency
        run: |
          python3 -m venv /tmp/mini-python
          /tmp/mini-python/bin/pip install Pillow==11.3.0
          echo '/tmp/mini-python/bin' >> "$GITHUB_PATH"
      - name: Prepare the six-key package
        run: |
          set -eu
          python3 tools/apply_shortcut_layout.py /tmp/mini-base
          python3 tools/animate_shortcuts.py /tmp/mini-base /tmp/mini-docs
          python3 mini/prepare_mini.py /tmp/mini-base package/$MINI_BUNDLE --guide /tmp/mini-docs/mini.html
          cp /tmp/mini-docs/mini.html package/$MINI_BUNDLE/Mini_Guide.html
          python3 mini/prepare_dual.py /tmp/mini-base package/$MINI_BUNDLE package/$DUAL_BUNDLE
      - name: Test Mini protocol, paging and package
        run: |
          set -eu
          gcc -O2 -Wall -Wextra -Werror mini/buttongoblin-mini.c -o /tmp/mini-host
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined mini/test_mini.c -o /tmp/test-mini
          ASAN_OPTIONS=detect_leaks=1 /tmp/test-mini "$PWD/package/$MINI_BUNDLE/Scripts/.config/buttongoblin-mini/buttons.conf"
          python3 mini/test_package.py package/$MINI_BUNDLE /tmp/mini-host
          find package -name '*.sh' -exec sh -n '{}' ';'
      - name: Test MK.2 and simultaneous service operation
        run: |
          set -eu
          app=package/$DUAL_BUNDLE/Scripts/.config/buttongoblin
          gcc -O2 -Wall -Wextra -Werror "$app/source/buttongoblin.c" -o /tmp/mk2-host
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_internal.c" -o /tmp/mk2-internal
          python3 "$app/source/test_host.py" /tmp/mk2-host
          python3 "$app/source/test_failures.py" /tmp/mk2-host /tmp/mk2-internal
          /tmp/mk2-internal
          /tmp/mk2-internal script /tmp/mk2-script-test
          /tmp/mk2-internal command /tmp/mk2-command-test
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_pages.c" -o /tmp/mk2-pages
          /tmp/mk2-pages
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_memory.c" -o /tmp/mk2-memory
          (cd "$app" && /tmp/mk2-memory buttons.conf icons)
          python3 mini/test_dual.py package/$DUAL_BUNDLE /tmp/mini-host /tmp/mk2-host
          python3 mini/test_branding.py package/$MINI_BUNDLE package/$DUAL_BUNDLE
          node --check docs/editor/app.js
      - name: Install pinned Zig compiler
        run: |
          set -eu
          curl --fail --location --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/mini-zig.tar.xz
          tar -xJf /tmp/mini-zig.tar.xz -C /tmp
          echo '/tmp/zig-linux-x86_64-0.13.0' >> "$GITHUB_PATH"
      - name: Cross-compile the static MiSTer binary
        working-directory: package/${{ env.MINI_BUNDLE }}/Scripts/.config/buttongoblin-mini
        run: |
          set -eu
          sh source/build.sh
          file buttongoblin-mister | tee /tmp/mini-binary-info
          grep -q ARM /tmp/mini-binary-info
          grep -q 'statically linked' /tmp/mini-binary-info
      - name: Cross-compile MK.2 and assemble both binaries
        run: |
          set -eu
          app=package/$DUAL_BUNDLE/Scripts/.config/buttongoblin
          sh "$app/source/build.sh"
          file "$app/buttongoblin-mister" | tee /tmp/mk2-binary-info
          grep -q ARM /tmp/mk2-binary-info
          grep -q 'statically linked' /tmp/mk2-binary-info
          cp package/$MINI_BUNDLE/Scripts/.config/buttongoblin-mini/buttongoblin-mister package/$DUAL_BUNDLE/Scripts/.config/buttongoblin-mini/buttongoblin-mister
      - name: Package and verify the Mini release
        run: |
          set -eu
          for bundle in "$MINI_BUNDLE" "$DUAL_BUNDLE"; do
            (cd "package/$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            (cd package && zip -qr "../$bundle.zip" "$bundle")
            sha256sum "$bundle.zip" > "$bundle.zip.sha256"
            unzip -t "$bundle.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUAL_BUNDLE }}
          path: |
            ${{ env.MINI_BUNDLE }}.zip
            ${{ env.MINI_BUNDLE }}.zip.sha256
            ${{ env.DUAL_BUNDLE }}.zip
            ${{ env.DUAL_BUNDLE }}.zip.sha256
          if-no-files-found: error
      - name: Test release publishing recovery
        run: python3 tools/test_release_publish.py
      - name: Publish Mini and Dual releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh tools/publish_release.sh "$MINI_TAG" "$MINI_BUNDLE" "Button Goblin Mini v$MINI_VERSION" mini/RELEASE_NOTES.md
          sh tools/publish_release.sh "$DUAL_TAG" "$DUAL_BUNDLE" "Button Goblin Dual v$DUAL_VERSION" mini/DUAL_README.md
