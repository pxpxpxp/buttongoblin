name: Build and release MiSTer Stream Deck
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'tools/**'
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'docs/editor/**'
permissions:
  contents: write
concurrency:
  group: streamdeck-v1-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore checked build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-inputs -name '*.b64' | wc -l)" -eq 24
          cat build-inputs/*.b64 | base64 --decode > /tmp/build-inputs.tar.gz
          echo '0858947cd0e25ca9b4e8629f81358e4168f4e13685c4177699813c22118fa1fe  /tmp/build-inputs.tar.gz' | sha256sum --check
          mkdir -p package/MiSTer_StreamDeck_v1
          tar -xzf /tmp/build-inputs.tar.gz -C package/MiSTer_StreamDeck_v1
          cp docs/index.html package/MiSTer_StreamDeck_v1/README_Guide_v1.html
          cp -a docs/editor package/MiSTer_StreamDeck_v1/Deck_Editor
          cp -a docs/assets package/MiSTer_StreamDeck_v1/assets
      - name: Install image-converter test dependency
        run: |
          python3 -m venv /tmp/streamdeck-python
          /tmp/streamdeck-python/bin/pip install Pillow==11.3.0
          echo "/tmp/streamdeck-python/bin" >> "$GITHUB_PATH"
      - name: Apply approved shortcut layout
        run: |
          python3 tools/apply_shortcut_layout.py package/MiSTer_StreamDeck_v1
          python3 tools/animate_shortcuts.py package/MiSTer_StreamDeck_v1 docs
          python3 tools/patch_shortcut_feedback.py package/MiSTer_StreamDeck_v1
          cp docs/index.html package/MiSTer_StreamDeck_v1/README_Guide_v1.html
          cp -a docs/editor/. package/MiSTer_StreamDeck_v1/Deck_Editor/
      - name: Run host checks
        working-directory: package/MiSTer_StreamDeck_v1/Scripts/.config/streamdeck
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/build-checks.log") 2>&1
          gcc -O2 -Wall -Wextra -Werror source/streamdeck.c -o /tmp/streamdeck-host
          gcc -O2 -Wall -Wextra -Werror source/test_internal.c -o /tmp/streamdeck-internal
          python3 source/test_host.py /tmp/streamdeck-host
          python3 source/test_failures.py /tmp/streamdeck-host /tmp/streamdeck-internal
          /tmp/streamdeck-internal
          /tmp/streamdeck-host --config buttons-shortcuts.conf --assets icons --validate
          gcc -O2 -Wall -Wextra -Werror source/test_pages.c -o /tmp/streamdeck-pages
          /tmp/streamdeck-pages
          gcc -O2 -Wall -Wextra -Werror source/test_memory.c -o /tmp/streamdeck-memory
          /tmp/streamdeck-memory buttons.conf icons
      - name: Install pinned Zig compiler
        run: |
          set -eu
          curl --fail --location --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Build static MiSTer ARM binary
        working-directory: package/MiSTer_StreamDeck_v1/Scripts/.config/streamdeck
        run: |
          sh source/build.sh
          file streamdeck-mister | tee /tmp/binary-info
          grep -q 'ARM' /tmp/binary-info
          grep -q 'statically linked' /tmp/binary-info
      - name: Package release
        run: |
          set -eu
          chmod +x package/MiSTer_StreamDeck_v1/Scripts/*.sh
          chmod +x package/MiSTer_StreamDeck_v1/Scripts/.config/streamdeck/extras/*.sh
          cd package/MiSTer_StreamDeck_v1
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ..
          zip -qr ../MiSTer_StreamDeck_v1.zip MiSTer_StreamDeck_v1
          cd ..
          sha256sum MiSTer_StreamDeck_v1.zip > MiSTer_StreamDeck_v1.zip.sha256
          unzip -t MiSTer_StreamDeck_v1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MiSTer_StreamDeck_v1
          path: |
            MiSTer_StreamDeck_v1.zip
            MiSTer_StreamDeck_v1.zip.sha256
          if-no-files-found: error
      - name: Publish v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v1 >/dev/null 2>&1; then
            gh release upload v1 MiSTer_StreamDeck_v1.zip MiSTer_StreamDeck_v1.zip.sha256 --clobber
          else
            gh release create v1 MiSTer_StreamDeck_v1.zip MiSTer_StreamDeck_v1.zip.sha256 --target "$GITHUB_SHA" --title "MiSTer Stream Deck v1" --notes "15-button MiSTer launcher with animated artwork, two pages, Update All, ascending brightness, guide and editor. Static Cortex-A9 ARM binary built and host-tested by GitHub Actions. Install the Scripts contents including the hidden .config folder."
          fi
